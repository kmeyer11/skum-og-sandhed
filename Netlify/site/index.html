<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skum og Sandhed</title>
    <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/img/roeverne-ikon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css?v=Gs7frR-dlWzUq-80gLFvZ4SHDPwNxR8YMS4gC3FolWI" />
</head>
<body>
    <nav class="site-nav" aria-label="Hovedmenu">
        <a class="home" href="/"><img src="/img/roeverne-ikon.svg" alt="" width="28" height="28">Skum og Sandhed</a>
        <a href="/" aria-current="page">Arkivet</a>
        <a href="/Statistik">Statistik</a>
        <a href="/Smagning">Ølsmagning</a>
        <a href="/Pejs">Pejsen</a>
    </nav>

    
<header class="pour">
    <div class="bubbles" aria-hidden="true"></div>
    <img class="badge" src="/img/roeverne-maerke.svg" alt="Røverne, Skum og Sandhed" width="200" height="200">
    <h1>Skum og Sandhed</h1>
</header>

<main class="archive">
    <div class="tools">
        <h2>Arkivet <small id="beerCount"></small></h2>
        <div class="filters">
            <select id="yearFilter" class="search year-filter" aria-label="Druk år">
                <option value="">Alle år</option>
            </select>
            <input id="beerSearch" class="search" type="search" placeholder="Søg i navn, bryggeri eller type" aria-label="Søg">
        </div>
    </div>
    <div class="table-wrap">
        <table id="beerTable">
            <thead>
                <tr>
                    <th>Navn</th>
                    <th>Bryg år</th>
                    <th>Druk år</th>
                    <th class="num">ABV</th>
                    <th>Gæring</th>
                    <th>Gærtype</th>
                    <th class="num">Pris</th>
                    <th>Røverne / Untappd</th>
                </tr>
            </thead>
        </table>
    </div>
</main>

<dialog id="beerModal" class="beer" aria-labelledby="beerModalLabel">
    <div class="d-head">
        <button type="button" class="d-close" aria-label="Luk">×</button>
        <h3 id="beerModalLabel"></h3>
        <p id="beerBreweries"></p>
    </div>
    <div class="d-body">
        <blockquote id="beerDescription"></blockquote>
        <dl class="facts" id="beerFacts"></dl>
        <dl class="ing" id="beerIngredients"></dl>
    </div>
</dialog>




    <footer class="site-footer">Data fra Røvernes regneark.</footer>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/site.js?v=Ec0B2xLeuwXmnSe1jOLl11ryVqVqohbKbTQ3UhqNp44"></script>

    
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
    $(function () {
        var { esc, kr, pct, rating, year, text, openBeer } = Skum;

        function glass(cls, v) {
            var fill = Math.min(Math.max(v / 5, 0), 1) * 100;
            return `<span class="glass ${cls}"><i style="--h:${fill}%"></i>${rating(v)}</span>`;
        }

        $.fn.dataTable.ext.errMode = 'none';

        var table = $('#beerTable').DataTable({
            ajax: { url: '/api/beers.json', dataSrc: '' },
            dom: 't<"dt-foot"i>',
            paging: false,
            order: [[7, 'desc']],
            language: {
                info: 'Viser _TOTAL_ øl',
                infoEmpty: 'Ingen øl',
                infoFiltered: '(fundet blandt _MAX_)',
                zeroRecords: 'Ingen øl matcher søgningen.',
                emptyTable: 'Arket er tomt.',
                loadingRecords: 'Henter øl fra arket…'
            },
            columns: [
                {
                    data: 'name', className: 'name',
                    render: (d, type, r) => type === 'display'
                        ? `${esc(d)}<span>${esc(r.breweries.join(' & '))}</span>`
                        : type === 'filter' ? [d, ...r.breweries, ...r.types].join(' ') : d
                },
                { data: 'releaseYear', render: (d, type) => type === 'display' ? year(d) : d },
                { data: 'drinkingYear', render: (d, type) => type === 'display' ? year(d) : d },
                { data: 'abv', className: 'num', render: (d, type) => type === 'display' ? pct(d) : d },
                { data: 'fermentation', render: (d, type) => type === 'display' ? text(d) : d },
                { data: 'yeastType', render: (d, type) => type === 'display' ? text(d) : d },
                { data: 'price', className: 'num', render: (d, type) => type === 'display' ? kr(d) : d },
                {
                    data: 'rating',
                    render: (d, type, r) => type === 'display'
                        ? `<span class="glasses">${glass('r', d)}${glass('u', r.untappdRating)}</span>`
                        : d
                }
            ],
            createdRow: row => { row.tabIndex = 0; },
            initComplete: function (settings, data) {
                var years = [...new Set(data.map(b => b.drinkingYear).filter(y => y > 0))].sort((a, b) => b - a);
                $('#yearFilter').append(years.map(y => `<option value="${y}">${y}</option>`).join(''));
            },
            drawCallback: function () {
                $('#beerCount').text(this.api().page.info().recordsDisplay + ' øl');
            }
        });

        table.on('error.dt', function () {
            $('#beerTable tbody').html('<tr><td colspan="8" class="dataTables_empty">Kunne ikke hente øl fra arket. Genindlæs siden, eller tjek at Google-arket er delt med service accounten.</td></tr>');
        });

        $('#beerSearch').on('input', function () { table.search(this.value).draw(); });
        $('#yearFilter').on('change', function () {
            table.column(2).search(this.value ? `^${this.value}$` : '', true, false).draw();
        });

        $('#beerTable tbody').on('click keydown', 'tr', function (e) {
            if (e.type === 'keydown' && e.key !== 'Enter') return;
            var data = table.row(this).data();
            if (data) openBeer(data);
        });
    });
    </script>

</body>
</html>
