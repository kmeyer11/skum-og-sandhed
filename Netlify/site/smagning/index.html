<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#xD8;lsmagning &#x2013; Skum og Sandhed</title>
    <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/img/roeverne-ikon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css?v=Gs7frR-dlWzUq-80gLFvZ4SHDPwNxR8YMS4gC3FolWI" />
</head>
<body class="smagning">
    <nav class="site-nav" aria-label="Hovedmenu">
        <a class="home" href="/"><img src="/img/roeverne-ikon.svg" alt="" width="28" height="28">Skum og Sandhed</a>
        <a href="/">Arkivet</a>
        <a href="/Statistik">Statistik</a>
        <a href="/Smagning" aria-current="page">Ølsmagning</a>
        <a href="/Pejs">Pejsen</a>
    </nav>

    
<main class="tasting" id="tasting" aria-busy="true">
    <h1 class="sr-only" id="tastingTitle">Ølsmagning</h1>
    <p class="tasting-status" id="tastingStatus">Henter øl fra arket…</p>

    <section class="tasting-beer" id="tastingBeer" aria-live="polite" hidden>
        <button type="button" class="arrow prev" id="prevBtn" aria-label="Forrige øl">←</button>
        <div class="label-wrap">
            <div class="label" id="beerLabel"></div>
            <div class="label-side" id="beerSide"></div>
        </div>
        <button type="button" class="arrow next" id="nextBtn" aria-label="Næste øl">→</button>
    </section>

    <section class="tasting-end" id="tastingEnd" hidden>
        <div class="end-head">
            <div>
                <h2>Skål!</h2>
                <p id="endSummary"></p>
            </div>
            <div class="end-actions">
                <button type="button" class="pill ghost" id="restartBtn">Start forfra</button>
                <a class="pill" href="/Statistik">Se statistikken</a>
            </div>
        </div>
        <ol class="label-wall" id="labelWall"></ol>
    </section>
</main>



    <footer class="site-footer">Data fra Røvernes regneark.</footer>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/site.js?v=Ec0B2xLeuwXmnSe1jOLl11ryVqVqohbKbTQ3UhqNp44"></script>

    
    <script src="/js/smagning.js?v=5JmE0JrGeXXR4gxCkZ3lIbqErMqIXxRVgLWAAAvhgzc"></script>

</body>
</html>
